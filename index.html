<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIAT Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="app-header">
    <div>
      <h1>PIAT Assistant</h1>
      <p>Generación asistida de PIAT iniciales y de revisión</p>
    </div>
  </header>

  <main class="app-main">

    <section class="card">
      <h2>Nuevo PIAT</h2>

      <div class="form-group">
        <label for="piatType">Tipo de informe</label>
        <select id="piatType">
          <option value="">Selecciona un tipo</option>
          <option value="inicial">PIAT inicial</option>
          <option value="revision">PIAT de revisión</option>
        </select>
      </div>

      <div class="form-group">
        <label for="patientName">Nombre del paciente</label>
        <input
          type="text"
          id="patientName"
          placeholder="Ej. Alejandro Tercero González"
        >
      </div>

      <div class="form-group">
        <label for="birthDate">Fecha de nacimiento</label>
        <input
          type="date"
          id="birthDate"
        >
      </div>

      <div class="form-group">
        <label for="previousPiat">PIAT anterior</label>
        <input
          type="file"
          id="previousPiat"
          accept=".pdf,.doc,.docx"
        >
        <small>
          Se utilizará principalmente en los PIAT de revisión.
        </small>
      </div>

      <div class="form-group">
        <label for="currentAssessment">Evaluación o resultados actuales</label>
        <input
          type="file"
          id="currentAssessment"
          accept=".pdf,.doc,.docx,.xlsx,.xls,.csv"
        >
      </div>

      <button id="continueButton" type="button">
        Continuar
      </button>
    </section>

    <section class="card">
      <h2>Estado</h2>
      <p id="status">Esperando datos del paciente.</p>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
